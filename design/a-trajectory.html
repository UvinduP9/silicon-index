<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silicon Index · A. Trajectory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0D1526; --surface: #16213A; --surface-2: #1C2947; --line: #26345A;
  --text: #E6ECF7; --muted: #8A97B3; --faint: #5B6889;
  --base: #62C3E6; --pro: #9D8CFF; --max: #E68AD0; --ultra: #E9C46A;
  --ref: #8A97B3; --focus: #9FE0FF;
}
[data-theme="light"] {
  --bg: #F3F5FA; --surface: #FFFFFF; --surface-2: #E8ECF5; --line: #D5DCEA;
  --text: #121A2E; --muted: #55617D; --faint: #8B95AD;
  --base: #1C8DBB; --pro: #6650E0; --max: #C2479F; --ultra: #A97E10;
  --ref: #6B7590; --focus: #1C6FD1;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 400 15px/24px "Schibsted Grotesk", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

.top {
  display: flex; align-items: center; gap: 28px;
  padding: 18px 32px; border-bottom: 1px solid var(--line);
}
.wordmark { font-weight: 750; font-size: 17px; letter-spacing: -0.01em; }
.wordmark span { color: var(--muted); font-weight: 500; }
.tabs { display: flex; gap: 4px; }
.tab { padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); background: var(--surface-2); }
.top .spacer { flex: 1; }
.seg { display: flex; background: var(--surface); border-radius: 8px; padding: 2px; }
.seg button { padding: 4px 10px; border-radius: 6px; color: var(--muted); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { color: var(--text); background: var(--surface); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; min-height: calc(100vh - 69px); }
.main { padding: 32px 32px 24px; border-right: 1px solid var(--line); min-width: 0; }
h1 { margin: 0; font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -0.015em; }
.sub { margin: 4px 0 0; color: var(--muted); }
.chart-wrap { position: relative; margin-top: 20px; }
svg { display: block; overflow: visible; font-variant-numeric: tabular-nums; }
.val, .num, .tip .big { font-variant-numeric: tabular-nums; }
.ref text, .end-label { font-variant-numeric: normal; }
.axis text { fill: var(--muted); font-size: 13px; }
.axis .year { fill: var(--faint); font-size: 12px; }
.grid line { stroke: var(--line); stroke-dasharray: 2 4; }
.series path { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.series .pt { stroke-width: 2; cursor: pointer; }
.series .pt.est { fill: var(--bg) !important; }
.series .end-label { font-weight: 650; font-size: 14px; }
.series .end-value { fill: var(--muted); font-size: 12px; }
.ref line { stroke: var(--ref); stroke-dasharray: 5 5; stroke-width: 1.25; }
.ref text { fill: var(--muted); font-size: 12px; }
.hover-ring { fill: none; stroke: var(--text); stroke-width: 1.5; pointer-events: none; }
.sel-ring { fill: none; stroke: var(--text); stroke-width: 2; pointer-events: none; }

.tip {
  position: absolute; pointer-events: none; min-width: 200px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font-size: 13px; line-height: 20px;
  box-shadow: 0 8px 24px rgba(3, 8, 20, 0.35); opacity: 0; transition: opacity 120ms;
}
.tip.on { opacity: 1; }
.tip b { font-size: 14px; }
.tip .big { font-size: 20px; font-weight: 700; line-height: 28px; }
.tip .delta { color: var(--muted); }
.legend-note { margin-top: 8px; color: var(--faint); font-size: 13px; display: flex; gap: 20px; flex-wrap: wrap; }
.legend-note .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--muted); margin-right: 6px; vertical-align: -1px; }
.legend-note .dot.full { background: var(--muted); }

.detail { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 220px 1fr; gap: 24px; }
.detail h2 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; }
.detail .tierline { color: var(--muted); font-size: 13px; }
.specs { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px 24px; margin: 0; }
.specs div { min-width: 0; }
.specs dt { color: var(--muted); font-size: 13px; }
.specs dd { margin: 0; font-weight: 600; }
.specs .wide { grid-column: 1 / -1; }
.src { color: var(--faint); font-size: 13px; margin-top: 12px; }
.src a { color: var(--muted); }

.rail { padding: 24px 20px; }
.rail h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.tier-toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 24px; }
.tier-toggle { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: var(--surface); font-size: 14px; }
.tier-toggle .sw { width: 10px; height: 10px; border-radius: 50%; }
.tier-toggle[aria-pressed="false"] { opacity: 0.45; }
.tier-toggle[aria-pressed="false"] .sw { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--muted); }
.chip-list { list-style: none; margin: 0 0 24px; padding: 0; }
.chip-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 5px 8px; border-radius: 8px; text-align: left; font-size: 14px; }
.chip-row:hover { background: var(--surface); }
.chip-row .sw { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.chip-row .val { margin-left: auto; color: var(--muted); font-size: 13px; }
.chip-row[aria-pressed="false"] { color: var(--faint); }
.chip-row[aria-pressed="false"] .sw { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--faint); }
.chip-row.selected { background: var(--surface-2); }
.gen-label { font-size: 12px; color: var(--faint); padding: 10px 8px 2px; }
.proto { font-size: 12px; color: var(--faint); margin-top: 8px; }

@media (max-width: 900px) {
  .top { flex-wrap: wrap; gap: 12px 20px; padding: 14px 16px; }
  .tabs { order: 3; width: 100%; overflow-x: auto; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .specs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .main { border-right: 0; padding: 24px 16px; }
  .rail { border-top: 1px solid var(--line); padding: 20px 16px; }
  .detail { grid-template-columns: 1fr; gap: 12px; }
  h1 { font-size: 22px; line-height: 30px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wordmark">Silicon Index</div>
  <nav class="tabs" role="tablist" aria-label="Metric" id="tabs"></nav>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="Scale">
    <button data-scale="linear" aria-pressed="true">Linear</button>
    <button data-scale="log" aria-pressed="false">Log</button>
  </div>
  <button class="icon-btn" id="theme" aria-label="Switch to light mode" title="Switch theme">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
  </button>
</header>

<div class="layout">
  <main class="main">
    <h1 id="title">Apple Silicon, M1 to M6</h1>
    <p class="sub" id="sub"></p>
    <div class="chart-wrap" id="chartWrap">
      <svg id="chart" role="img" aria-label="Line chart of scores by generation"></svg>
      <div class="tip" id="tip"></div>
    </div>
    <div class="legend-note">
      <span><span class="dot full"></span>Measured</span>
      <span><span class="dot"></span>Estimate, needs a source</span>
      <span>Dashed lines are non-M chips, shown for scale</span>
    </div>
    <section class="detail" id="detail" aria-live="polite"></section>
  </main>

  <aside class="rail">
    <h3>Tiers</h3>
    <div class="tier-toggles" id="tierToggles"></div>
    <h3>Chips</h3>
    <ul class="chip-list" id="chipList"></ul>
    <h3>For scale</h3>
    <ul class="chip-list" id="refList"></ul>
    <p class="proto">Prototype. Sample Geekbench 6 numbers, not yet verified.</p>
  </aside>
</div>

<script src="data.js"></script>
<script>if (new URLSearchParams(location.search).get("theme") === "light") document.documentElement.dataset.theme = "light";</script>
<script>
const D = window.SI;
const state = {
  metric: new URLSearchParams(location.search).get("m") || "mc", scale: "linear",
  tiers: new Set(["base", "pro", "max", "ultra"]),
  hidden: new Set(),
  refs: new Set(["ultra9-285hx"]),
  selected: "m4-pro",
  drawn: false,
};
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const metric = () => D.metrics.find((m) => m.id === state.metric);
// Thin-space digit grouping (SI style) keeps numbers compact and avoids wide tabular commas.
const fmt = (v) => v == null ? "n/a" : v.toLocaleString("en-US").replace(/,/g, "\u202F");
const gen = (g) => D.gens.find((x) => x.gen === g);
const tierLabel = (t) => D.tiers.find((x) => x.id === t).label;
const subtitles = {
  sc: "Geekbench 6 single-core. Higher is better.",
  mc: "Geekbench 6 multi-core. Higher is better.",
  gpu: "Geekbench 6 GPU, Metal API. Higher is better.",
  bw: "Unified memory bandwidth in GB/s, from Apple's specs.",
};

// Tabs
const tabs = document.getElementById("tabs");
D.metrics.forEach((m) => {
  const b = document.createElement("button");
  b.className = "tab"; b.role = "tab"; b.textContent = m.short; b.dataset.m = m.id;
  b.onclick = () => { state.metric = m.id; render(); };
  tabs.appendChild(b);
});
document.querySelectorAll("[data-scale]").forEach((b) => b.onclick = () => { state.scale = b.dataset.scale; render(); });
document.getElementById("theme").onclick = () => {
  const r = document.documentElement;
  const next = r.dataset.theme === "dark" ? "light" : "dark";
  r.dataset.theme = next;
  document.getElementById("theme").setAttribute("aria-label", `Switch to ${next === "dark" ? "light" : "dark"} mode`);
  render();
};

function visibleChips() {
  return D.chips.filter((c) => state.tiers.has(c.tier) && !state.hidden.has(c.id));
}

function renderRail() {
  const tt = document.getElementById("tierToggles");
  tt.innerHTML = "";
  D.tiers.forEach((t) => {
    const b = document.createElement("button");
    b.className = "tier-toggle";
    b.setAttribute("aria-pressed", state.tiers.has(t.id));
    b.innerHTML = `<span class="sw" style="background:var(--${t.id})"></span>${t.label}`;
    b.onclick = () => { state.tiers.has(t.id) ? state.tiers.delete(t.id) : state.tiers.add(t.id); render(); };
    tt.appendChild(b);
  });

  const list = document.getElementById("chipList");
  list.innerHTML = "";
  [...D.gens].reverse().forEach((g) => {
    const chips = D.chips.filter((c) => c.gen === g.gen);
    const lab = document.createElement("li");
    lab.className = "gen-label"; lab.textContent = `${g.label} generation, ${g.year}`;
    list.appendChild(lab);
    chips.forEach((c) => {
      const li = document.createElement("li");
      const on = state.tiers.has(c.tier) && !state.hidden.has(c.id);
      li.innerHTML = `<button class="chip-row${state.selected === c.id ? " selected" : ""}" aria-pressed="${on}">
        <span class="sw" style="background:var(--${c.tier})"></span>${c.name}<span class="val">${fmt(c[state.metric])}</span></button>`;
      li.firstElementChild.onclick = () => {
        if (!state.tiers.has(c.tier)) { state.tiers.add(c.tier); state.hidden.delete(c.id); }
        else state.hidden.has(c.id) ? state.hidden.delete(c.id) : state.hidden.add(c.id);
        render();
      };
      list.appendChild(li);
    });
  });

  const refs = document.getElementById("refList");
  refs.innerHTML = "";
  D.references.forEach((r) => {
    const li = document.createElement("li");
    li.innerHTML = `<button class="chip-row" aria-pressed="${state.refs.has(r.id)}">
      <span class="sw" style="background:var(--ref)"></span>${r.name}<span class="val">${fmt(r[state.metric])}</span></button>`;
    li.firstElementChild.onclick = () => { state.refs.has(r.id) ? state.refs.delete(r.id) : state.refs.add(r.id); render(); };
    refs.appendChild(li);
  });
}

function renderChart() {
  const wrap = document.getElementById("chartWrap");
  const svg = document.getElementById("chart");
  const W = wrap.clientWidth, H = Math.max(320, Math.min(520, W * 0.55));
  const m = { t: 16, r: W < 600 ? 72 : 110, b: 48, l: 56 };
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  const key = state.metric;
  const chips = visibleChips().filter((c) => c[key] != null);
  const refs = D.references.filter((r) => state.refs.has(r.id) && r[key] != null);
  const vals = [...chips.map((c) => c[key]), ...refs.map((r) => r[key])];
  if (!vals.length) { svg.innerHTML = `<text x="${m.l}" y="60" fill="${css("--muted")}">Turn on a tier or chip on the right to see it here.</text>`; return; }

  let lo = Math.min(...vals), hi = Math.max(...vals);
  const log = state.scale === "log";
  if (!log) { const pad = (hi - lo) * 0.08 || hi * 0.1; lo = Math.max(0, lo - pad); hi = hi + pad; }
  else { lo = lo / 1.15; hi = hi * 1.1; }
  const y = (v) => {
    const t = log ? (Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)) : (v - lo) / (hi - lo);
    return m.t + (1 - t) * (H - m.t - m.b);
  };
  const x = (g) => m.l + ((g - 1) / 5) * (W - m.l - m.r);

  const ticks = niceTicks(lo, hi, log);
  let out = `<g class="grid">${ticks.map((t) => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>`;
  out += `<g class="axis">`;
  out += ticks.map((t) => `<text x="${m.l - 10}" y="${y(t) + 4}" text-anchor="end">${short(t)}</text>`).join("");
  out += D.gens.map((g) => `<text x="${x(g.gen)}" y="${H - m.b + 22}" text-anchor="middle">${g.label}</text><text class="year" x="${x(g.gen)}" y="${H - m.b + 38}" text-anchor="middle">${g.year}</text>`).join("");
  out += `</g>`;

  out += `<g class="ref">${refs.map((r) => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(r[key])}" y2="${y(r[key])}"/><text x="${m.l + 6}" y="${y(r[key]) - 6}">${r.maker} ${r.name} at ${short(r[key])}</text>`).join("")}</g>`;

  // Series per tier
  const labels = [];
  let series = "";
  D.tiers.forEach((t) => {
    const pts = chips.filter((c) => c.tier === t.id).sort((a, b) => a.gen - b.gen);
    if (!pts.length) return;
    const color = css(`--${t.id}`);
    const d = pts.map((c, i) => `${i ? "L" : "M"}${x(c.gen)},${y(c[key])}`).join("");
    series += `<g class="series"><path d="${d}" stroke="${color}" class="line"/>`;
    series += pts.map((c) => `<circle class="pt${c.est ? " est" : ""}" data-id="${c.id}" cx="${x(c.gen)}" cy="${y(c[key])}" r="4.5" fill="${color}" stroke="${color}"/>`).join("");
    series += `</g>`;
    const last = pts[pts.length - 1];
    labels.push({ tier: t, color, x: x(last.gen) + 12, y: y(last[key]), v: last[key] });
  });
  // Nudge end labels apart so they never overlap
  labels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 34 && Math.abs(labels[i].x - labels[i - 1].x) < 80) labels[i].y = labels[i - 1].y + 34;
  series += labels.map((l) => `<g class="series"><text class="end-label" x="${l.x}" y="${l.y + 1}" fill="${l.color}">${l.tier.label}</text><text class="end-value" x="${l.x}" y="${l.y + 16}">${fmt(l.v)}</text></g>`).join("");
  out += series;

  const sel = chips.find((c) => c.id === state.selected);
  if (sel) out += `<circle class="sel-ring" cx="${x(sel.gen)}" cy="${y(sel[key])}" r="9"/>`;
  out += `<circle class="hover-ring" id="hoverRing" r="0"/>`;
  svg.innerHTML = out;

  // One orchestrated moment: lines draw in on first load only.
  if (!state.drawn && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    svg.querySelectorAll("path.line").forEach((p, i) => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 900, delay: i * 90, easing: "cubic-bezier(.2,.7,.2,1)", fill: "forwards" });
    });
  }
  state.drawn = true;

  // Hover: nearest point within 28px
  const tip = document.getElementById("tip");
  const ring = document.getElementById("hoverRing");
  const pts = chips.map((c) => ({ c, px: x(c.gen), py: y(c[key]) }));
  svg.onmousemove = (e) => {
    const r = svg.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    let best = null, bd = 28;
    pts.forEach((p) => { const d = Math.hypot(p.px - mx, p.py - my); if (d < bd) { bd = d; best = p; } });
    if (!best) { tip.classList.remove("on"); ring.setAttribute("r", 0); svg.style.cursor = ""; return; }
    svg.style.cursor = "pointer";
    ring.setAttribute("cx", best.px); ring.setAttribute("cy", best.py); ring.setAttribute("r", 8);
    const c = best.c;
    const prev = D.chips.filter((p) => p.tier === c.tier && p.gen < c.gen).sort((a, b) => b.gen - a.gen)[0];
    const delta = prev ? `${pct(c[key], prev[key])} vs ${prev.name}` : "First of its tier";
    tip.innerHTML = `<b>${c.name}</b> <span class="delta">${c.year}</span><div class="big">${fmt(c[key])} <span class="delta" style="font-size:13px;font-weight:400">${metric().unit}</span></div><div class="delta">${delta}</div>${c.est ? `<div class="delta">Estimate, not yet sourced</div>` : ""}`;
    const tx = Math.min(best.px + 16, W - 220), ty = Math.max(0, best.py - 90);
    tip.style.left = tx + "px"; tip.style.top = ty + "px"; tip.classList.add("on");
    svg.onclick = () => { state.selected = c.id; render(); };
  };
  svg.onmouseleave = () => { tip.classList.remove("on"); ring.setAttribute("r", 0); };
}

function renderDetail() {
  const c = D.chips.find((x) => x.id === state.selected);
  const el = document.getElementById("detail");
  if (!c) { el.innerHTML = `<p class="sub">Click any point to see that chip's details.</p>`; return; }
  const g = gen(c.gen);
  el.innerHTML = `<div><h2>${c.name}</h2><div class="tierline">${tierLabel(c.tier)} tier, ${g.label} generation, ${c.year}</div></div>
  <div><dl class="specs">
    <div><dt>Single-core</dt><dd class="num">${fmt(c.sc)}</dd></div>
    <div><dt>Multi-core</dt><dd class="num">${fmt(c.mc)}</dd></div>
    <div><dt>GPU (Metal)</dt><dd class="num">${fmt(c.gpu)}</dd></div>
    <div><dt>CPU cores</dt><dd>${c.pc + c.ec} <span style="color:var(--muted);font-weight:400">(${c.pc}P + ${c.ec}E)</span></dd></div>
    <div><dt>GPU cores</dt><dd>${c.gpuc}</dd></div>
    <div><dt>Bandwidth</dt><dd>${c.bw} GB/s</dd></div>
    <div><dt>Max memory</dt><dd>${c.mem} GB</dd></div>
    <div><dt>Process</dt><dd>${g.node}</dd></div>
    <div class="wide"><dt>Ships in</dt><dd>${c.devices.join(", ")}</dd></div>
  </dl>
  <div class="src">Sources: Geekbench Browser, Notebookcheck, Apple tech specs. Each number will link to its exact source.</div></div>`;
}

function niceTicks(lo, hi, log) {
  if (log) {
    const out = [];
    const steps = [1, 2, 5];
    for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++)
      steps.forEach((s) => { const v = s * 10 ** e; if (v >= lo && v <= hi) out.push(v); });
    return out;
  }
  const span = hi - lo, raw = span / 5, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((s) => s * mag).find((s) => span / s <= 6);
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) out.push(v);
  return out;
}
const short = (v) => v >= 10000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0).replace(/\.0$/, "") + "k" : fmt(v);
const pct = (a, b) => { const p = Math.round((a / b - 1) * 100); return (p >= 0 ? "+" : "") + p + "%"; };

function render() {
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.m === state.metric));
  document.querySelectorAll("[data-scale]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.scale === state.scale));
  document.getElementById("sub").textContent = subtitles[state.metric];
  renderRail(); renderChart(); renderDetail();
}
new ResizeObserver(() => renderChart()).observe(document.getElementById("chartWrap"));
render();
</script>
</body>
</html>
