<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silicon Index · B. Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1A1F2B; --surface: #20263400; --raised: #212837; --hover: #273042; --sel: #2C3850;
  --text: #EEE6D8; --muted: #A3ABB8; --faint: #6E7788; --rule: #2F384A;
  --accent: #86C1FF; --up: #7FD8A6; --down: #F29A8B; --bar: #3A4559;
}
[data-theme="light"] {
  --bg: #ECEAE6; --raised: #F8F7F4; --hover: #EFEDE8; --sel: #E2E9F5;
  --text: #1E2430; --muted: #5E6573; --faint: #959AA4; --rule: #DEDAD2;
  --accent: #2468C8; --up: #1C8A52; --down: #C2493A; --bar: #D5D1C8;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 400 15px/24px "Archivo", system-ui, sans-serif; font-stretch: 100%;
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.wrap { max-width: 1440px; margin: 0 auto; padding: 40px 32px 140px; }
header { display: flex; align-items: flex-start; gap: 24px; }
.title { margin: 0; font-size: 52px; line-height: 52px; font-weight: 850; font-stretch: 125%; letter-spacing: -0.02em; }
.lede { margin: 12px 0 0; color: var(--muted); max-width: 62ch; font-size: 16px; }
.head-text { flex: 1 1 auto; min-width: 0; }
.theme { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.theme:hover { background: var(--raised); color: var(--text); }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin: 32px 0 16px; }
.seg { display: inline-flex; background: var(--raised); border-radius: 10px; padding: 3px; }
.seg button { padding: 5px 14px; border-radius: 7px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--text); }
.check { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.baseline { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; color: var(--muted); }
.baseline select { background: var(--raised); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; color: var(--text); }

.table-shell { background: var(--raised); border-radius: 14px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
thead th { position: sticky; top: 0; background: var(--raised); z-index: 1; text-align: right; font-weight: 550; color: var(--muted); font-size: 13px; padding: 14px 12px 10px; white-space: nowrap; }
thead th.l, thead th.m { text-align: left; }
thead th button { color: inherit; font-weight: inherit; display: inline-flex; gap: 6px; align-items: center; padding: 2px 0; }
thead th button:hover { color: var(--text); }
thead th[aria-sort="descending"] button { color: var(--accent); }
.arrow { width: 8px; display: inline-block; }
tbody tr { position: relative; }
tbody td { padding: 9px 12px; text-align: right; white-space: nowrap; }
tbody tr:hover td { background: var(--hover); }
tbody tr.picked td { background: var(--sel); }
tbody tr.is-base td { background: var(--sel); }
td.l, td.m { text-align: left; }
td.rank { color: var(--faint); width: 44px; font-stretch: 87.5%; }
.pick { accent-color: var(--accent); width: 15px; height: 15px; vertical-align: -2px; cursor: pointer; }
.name { font-weight: 650; font-stretch: 125%; font-size: 15px; letter-spacing: -0.005em; }
.meta { color: var(--muted); font-size: 13px; font-stretch: 100%; margin-left: 10px; }
.tag { font-size: 12px; color: var(--bg); background: var(--accent); padding: 1px 7px; border-radius: 5px; margin-left: 8px; font-weight: 600; }
.ref .name { font-weight: 500; color: var(--muted); }
.ref .meta { color: var(--faint); }
.est { color: var(--faint); font-size: 12px; margin-left: 3px; }
.cell { display: inline-flex; align-items: center; gap: 10px; font-stretch: 87.5%; font-size: 15px; }
.cell > span:first-child { min-width: 66px; text-align: right; }
.bar { width: 56px; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--bar) 45%, transparent); position: relative; overflow: hidden; flex: none; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--bar); }
.sorted .bar i { background: var(--accent); }
.sorted .cell { font-weight: 650; }
.up { color: var(--up); } .down { color: var(--down); }
.bar i.up { background: var(--up); } .bar i.down { background: var(--down); }
.dim { color: var(--muted); font-stretch: 87.5%; }
.foot { color: var(--faint); font-size: 13px; margin-top: 14px; }

.tray {
  position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, calc(100% + 48px)); visibility: hidden;
  width: min(1100px, calc(100% - 32px)); background: var(--sel); border-radius: 16px;
  padding: 16px 20px; box-shadow: 0 18px 48px rgba(8, 10, 18, 0.45);
  transition: transform 260ms cubic-bezier(.2,.8,.2,1), visibility 0s 260ms;
  display: grid; grid-template-columns: 150px repeat(var(--n, 2), minmax(0, 1fr)) 32px; gap: 4px 20px; align-items: baseline;
}
.tray.open { transform: translate(-50%, 0); visibility: visible; transition: transform 260ms cubic-bezier(.2,.8,.2,1); }
.tray .h { font-weight: 650; font-stretch: 125%; }
.tray .k { color: var(--muted); font-size: 13px; }
.tray .v { font-variant-numeric: tabular-nums; font-stretch: 87.5%; }
.tray .v small { margin-left: 6px; font-size: 13px; }
.tray .x { grid-row: 1; grid-column: -2; justify-self: end; color: var(--muted); width: 28px; height: 28px; border-radius: 6px; }
.tray .x:hover { background: var(--hover); color: var(--text); }

@media (max-width: 760px) {
  .wrap { padding: 24px 16px 160px; }
  .title { font-size: 34px; line-height: 38px; }
  .baseline { margin-left: 0; }
  .seg { overflow-x: auto; max-width: 100%; }
  .cores, .memc, .ns, .meta { display: none; }
  .rankby { display: inline-flex !important; }
  .tray { grid-template-columns: 96px repeat(var(--n, 2), minmax(0, 1fr)) 28px; gap: 4px 10px; padding: 14px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-text">
      <h1 class="title">Silicon Index</h1>
      <p class="lede">Every Apple M-series chip, ranked. Sort by any column, or pick a chip you own and see everything else as a multiple of it.</p>
    </div>
    <button class="theme" id="theme" aria-label="Switch to light mode" title="Switch theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Tier" id="tiers"></div>
    <div class="seg rankby" role="group" aria-label="Rank by" id="rankby" style="display:none"></div>
    <label class="check"><input type="checkbox" id="refs"> Show non-M chips for scale</label>
    <label class="baseline">Compare to
      <select id="baseline"><option value="">Absolute numbers</option></select>
    </label>
  </div>

  <div class="table-shell">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="foot">Geekbench 6 scores. Numbers with a small e are estimates waiting for a source. Prototype, sample data.</p>
</div>

<aside class="tray" id="tray" aria-live="polite"></aside>

<script src="data.js"></script>
<script>
const D = window.SI;
const q = new URLSearchParams(location.search);
if (q.get("theme") === "light") document.documentElement.dataset.theme = "light";
const state = {
  sort: q.get("sort") || "mc", tier: "all", refs: q.has("refs"),
  base: q.get("base") || "", picked: (q.get("pick") || "").split(",").filter(Boolean),
};
const metricCols = [
  { id: "sc", label: "Single-core" },
  { id: "mc", label: "Multi-core" },
  { id: "gpu", label: "GPU (Metal)" },
  { id: "bw", label: "Bandwidth", unit: " GB/s" },
];
const all = [...D.chips.map((c) => ({ ...c, kind: "m" })), ...D.references.map((r) => ({ ...r, kind: "ref" }))];
const byId = Object.fromEntries(all.map((c) => [c.id, c]));
const fmt = (v) => v == null ? "–" : v.toLocaleString("en-US").replace(/,/g, " ");
const tierLabel = (t) => D.tiers.find((x) => x.id === t)?.label;

// Tier filter
const tiersEl = document.getElementById("tiers");
[{ id: "all", label: "All" }, ...D.tiers].forEach((t) => {
  const b = document.createElement("button");
  b.textContent = t.label; b.dataset.t = t.id;
  b.onclick = () => { state.tier = t.id; render(); };
  tiersEl.appendChild(b);
});
const rankEl = document.getElementById("rankby");
metricCols.forEach((m) => {
  const b = document.createElement("button");
  b.textContent = D.metrics.find((x) => x.id === m.id).short; b.dataset.s = m.id;
  b.onclick = () => { state.sort = m.id; render(true); };
  rankEl.appendChild(b);
});
const refsEl = document.getElementById("refs");
refsEl.checked = state.refs;
refsEl.onchange = () => { state.refs = refsEl.checked; render(); };
const baseEl = document.getElementById("baseline");
D.chips.forEach((c) => baseEl.insertAdjacentHTML("beforeend", `<option value="${c.id}">${c.name}</option>`));
baseEl.value = state.base;
baseEl.onchange = () => { state.base = baseEl.value; render(); };
document.getElementById("theme").onclick = () => {
  const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
};

function header() {
  const row = document.getElementById("headRow");
  row.innerHTML = `<th class="l" style="width:44px">#</th><th class="l">Chip</th><th class="cores">Cores, CPU / GPU</th>` +
    metricCols.map((m) => `<th class="m${state.sort === m.id ? "" : " ns"}" aria-sort="${state.sort === m.id ? "descending" : "none"}"><button data-sort="${m.id}">${m.label}<span class="arrow">${state.sort === m.id ? "↓" : ""}</span></button></th>`).join("") +
    `<th class="memc">Max memory</th><th style="width:40px"><span class="sr" aria-label="Compare"></span></th>`;
  row.querySelectorAll("[data-sort]").forEach((b) => b.onclick = () => { state.sort = b.dataset.sort; render(true); });
}

function rows() {
  let list = all.filter((c) => c.kind === "ref" ? state.refs : (state.tier === "all" || c.tier === state.tier));
  list.sort((a, b) => (b[state.sort] ?? -1) - (a[state.sort] ?? -1));
  const base = byId[state.base];
  const max = {};
  metricCols.forEach((m) => {
    max[m.id] = Math.max(...list.map((c) => base ? (c[m.id] ?? 0) / base[m.id] : (c[m.id] ?? 0)));
  });
  let rank = 0;
  return list.map((c) => {
    if (c.kind === "m") rank++;
    const meta = c.kind === "ref" ? `${c.maker}, ${c.note}` : `${tierLabel(c.tier)}, ${c.year}`;
    const cells = metricCols.map((m) => {
      const v = c[m.id];
      if (v == null) return `<td class="m${state.sort === m.id ? " sorted" : " ns"}"><span class="cell dim"><span>–</span><span class="bar"></span></span></td>`;
      let text, w, cls = "";
      if (base) {
        const r = v / base[m.id];
        text = c.id === base.id ? "1.00×" : r.toFixed(2) + "×";
        cls = c.id === base.id ? "" : r >= 1 ? "up" : "down";
        w = r / max[m.id];
      } else { text = fmt(v) + (m.unit || ""); w = v / max[m.id]; }
      return `<td class="m${state.sort === m.id ? " sorted" : " ns"}"><span class="cell"><span class="${cls}">${text}${c.est && m.id !== "bw" ? `<span class="est" title="Estimate">e</span>` : ""}</span><span class="bar"><i class="${cls}" style="width:${(w * 100).toFixed(1)}%"></i></span></span></td>`;
    }).join("");
    const picked = state.picked.includes(c.id);
    return `<tr data-id="${c.id}" class="${c.kind === "ref" ? "ref" : ""}${picked ? " picked" : ""}${base && c.id === base.id ? " is-base" : ""}">
      <td class="rank l">${c.kind === "m" ? rank : ""}</td>
      <td class="l"><span class="name">${c.name}</span><span class="meta">${meta}</span>${base && c.id === base.id ? `<span class="tag">Baseline</span>` : ""}</td>
      <td class="dim cores">${c.pc + c.ec} / ${c.gpuc ?? "–"}</td>
      ${cells}
      <td class="dim memc">${c.mem} GB</td>
      <td><input type="checkbox" class="pick" aria-label="Compare ${c.name}" ${picked ? "checked" : ""}></td></tr>`;
  }).join("");
}

function tray() {
  const t = document.getElementById("tray");
  const picks = state.picked.map((id) => byId[id]).filter(Boolean);
  t.classList.toggle("open", picks.length >= 2);
  if (picks.length < 2) return;
  t.style.setProperty("--n", picks.length);
  const first = picks[0];
  let html = `<span class="k">Comparing to ${first.name}</span>` + picks.map((c) => `<span class="h">${c.name}</span>`).join("") + `<button class="x" id="clear" aria-label="Clear comparison">✕</button>`;
  metricCols.forEach((m) => {
    html += `<span class="k">${m.label}</span>`;
    html += picks.map((c, i) => {
      const v = c[m.id];
      if (v == null || first[m.id] == null) return `<span class="v dim">–</span>`;
      const p = Math.round((v / first[m.id] - 1) * 100);
      return `<span class="v">${fmt(v)}${i ? `<small class="${p >= 0 ? "up" : "down"}">${p >= 0 ? "+" : ""}${p}%</small>` : ""}</span>`;
    }).join("") + `<span></span>`;
  });
  t.innerHTML = html;
  document.getElementById("clear").onclick = () => { state.picked = []; render(); };
}

function render(animate) {
  const tbody = document.getElementById("rows");
  // FLIP: remember where rows were so a re-sort visibly moves them.
  const before = {};
  if (animate) tbody.querySelectorAll("tr").forEach((r) => before[r.dataset.id] = r.getBoundingClientRect().top);
  tiersEl.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.t === state.tier));
  rankEl.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.s === state.sort));
  header();
  tbody.innerHTML = rows();
  tbody.querySelectorAll(".pick").forEach((cb) => cb.onchange = () => {
    const id = cb.closest("tr").dataset.id;
    state.picked = cb.checked ? [...state.picked, id].slice(-4) : state.picked.filter((x) => x !== id);
    render();
  });
  if (animate && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    tbody.querySelectorAll("tr").forEach((r) => {
      const was = before[r.dataset.id];
      if (was == null) return;
      const dy = was - r.getBoundingClientRect().top;
      if (dy) r.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(.2,.8,.2,1)" });
    });
  }
  tray();
}
render();
</script>
</body>
</html>
